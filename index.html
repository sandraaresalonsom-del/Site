<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SiTe - Un espacio para ti</title>

<style>

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f5f1eb;

  color: #35413d;

}

header {

  background: #78968a;

  color: white;

  padding: 35px 20px;

  text-align: center;

}

h1 { font-size: 42px; margin: 0; }

main {

  max-width: 500px;

  margin: 30px auto;

  padding: 20px;

}

.panel {

  background: white;

  padding: 25px;

  border-radius: 18px;

  text-align: center;

}

input, button {

  width: 100%;

  box-sizing: border-box;

  padding: 13px;

  margin: 8px 0;

  border-radius: 10px;

  font-size: 16px;

}

input { border: 1px solid #ccc; }

button {

  background: #78968a;

  color: white;

  border: none;

}

#mensaje { margin-top: 15px; }
.portada {
  min-height: 100vh;
  width: 100%;
  background-image: linear-gradient(
    rgba(30, 45, 38, 0.30),
    rgba(30, 45, 38, 0.45)
  ), url("IMG_3305.jpeg");
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  box-sizing: border-box;
}

.contenido-portada {
  color: white;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

.contenido-portada h1 {
  font-size: 52px;
  margin-bottom: 12px;
}

.contenido-portada p {
  font-size: 21px;
  margin: 10px 0;
}

.contenido-portada .frase-portada {
  font-size: 17px;
  max-width: 300px;
  line-height: 1.5;
}
</style>

</head>

<body>

<header class="portada">

  <div class="contenido-portada">

    <h1>SiTe</h1>

    <p>Un espacio para ti</p>

    <p class="frase-portada">Un lugar para expresarte, escuchar y sentirte acompañado.</p>
<button type="button" onclick="document.getElementById('acceso').scrollIntoView({behavior:'smooth'})">Comenzar</button>
  </div>

</header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://yayccluspgbxltlpfmzn.supabase.co";

const SUPABASE_KEY = "sb_publishable_XkVfHTjGqGwLXL_SQS-isQ_FX5jSP4R";



const supabaseClient = supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY

);
async function registrar() {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({

    email,

    password

  });

  document.getElementById("mensaje").textContent =

    error ? error.message : "Revisa tu correo para confirmar la cuenta.";

}

async function entrar() {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({

    email,

    password

  });

  if (error) {

    document.getElementById("mensaje").textContent = error.message;

    return;

  }

  window.location.href = "edad.html";

}


</script>
<section id="acceso">

  <h2>Entra en SiTe</h2>

  <input type="email" id="email" placeholder="Tu correo electrónico">

  <input type="password" id="password" placeholder="Tu contraseña">

  <button type="button" onclick="registrar()">Crear cuenta</button>

  <button type="button" onclick="entrar()">Iniciar sesión</button>

  <p id="mensaje"></p>

</section>
</body>

</html>
