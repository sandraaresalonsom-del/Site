<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SiTe - Un espacio para ti</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f1eb;

      color: #35413d;

    }

    header {

      background: #78968a;

      color: white;

      padding: 35px 20px;

      text-align: center;

    }

    h1 {

      font-size: 42px;

      margin: 0;

    }

    main {

      max-width: 650px;

      margin: 35px auto;

      padding: 25px;

      text-align: center;

    }

    .panel {

      background: white;

      padding: 25px;

      border-radius: 18px;

      margin-bottom: 20px;

    }

    button {

      background: #78968a;

      color: white;

      border: none;

      padding: 14px 25px;

      border-radius: 12px;

      font-size: 16px;

    }

  </style>

</head>

<body>

<header>

  <h1>SiTe</h1>

  <p>Un espacio para ti</p>

</header>

<main>

  <div class="panel">

    <h2>Bienvenido a SiTe</h2>

    <p>Un lugar donde puedes expresarte, compartir y sentirte escuchado.</p>

  </div>

  <div class="panel">

    <h2>Este espacio es tuyo</h2>

    <p>Aquí todas las personas merecen respeto, comprensión y tranquilidad.</p>

    <button>Comenzar</button>

  </div>

</main>

</body>

</html>
