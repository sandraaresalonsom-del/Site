<!DOCTYPE html>

<html lang="es">

<head>

<title>SiTe - Un espacio para ti</title>

<style>

body {

<body>

<header>

  <h1>SiTe</h1>

    <p>Aquí todas las personas merecen respeto, comprensión y tranquilidad.</p>

    <h3>Crear una cuenta</h3>

    <input id="email" type="email" placeholder="Tu correo electrónico">

  </div>

</main>

const supabaseClient = supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY

);

async function registrar() {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({

    email,

    password

  });

  document.getElementById("mensaje").textContent =

    error ? error.message : "Revisa tu correo para confirmar la cuenta.";

}

async function entrar() {

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({

    email,

    password

  });

  document.getElementById("mensaje").textContent =

    error ? error.message : "Has iniciado sesión correctamente.";

}
