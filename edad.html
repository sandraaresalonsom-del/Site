

<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SiTe - Tu edad</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f5f1eb;

      color: #35413d;

      text-align: center;

      padding: 35px 20px;

    }

    .caja {

      max-width: 420px;

      margin: 40px auto;

      padding: 25px;

      background: white;

      border-radius: 16px;

    }

    input, button {

      width: 100%;

      box-sizing: border-box;

      padding: 14px;

      margin-top: 18px;

      border-radius: 8px;

      font-size: 16px;

    }

    input {

      border: 1px solid #78968a;

    }

    button {

      background: #78968a;

      color: white;

      border: none;

    }

    .aviso {

      font-size: 14px;

      line-height: 1.5;

    }

  </style>

</head>

<body>

  <div class="caja">

    <h1>SiTe</h1>

    <h2>Antes de empezar...</h2>

    <p>¿Cuál es tu fecha de nacimiento?</p>

    <input type="date" id="nacimiento">

    <p class="aviso">

      Tu fecha de nacimiento es privada.

      No aparecerá en tu perfil ni será visible

      para otras personas.

    </p>

    <button onclick="continuar()">Continuar</button>

    <p id="mensaje"></p>

  </div>

  <script>

    function continuar() {

      const fecha = document.getElementById('nacimiento').value;

      const mensaje = document.getElementById('mensaje');

      if (!fecha) {

        mensaje.textContent = 'Selecciona tu fecha de nacimiento.';

        return;

      }

      const nacimiento = new Date(fecha + 'T12:00:00');

      const hoy = new Date();

      let edad = hoy.getFullYear() - nacimiento.getFullYear();

      if (

        hoy.getMonth() < nacimiento.getMonth() ||

        (hoy.getMonth() === nacimiento.getMonth() &&

         hoy.getDate() < nacimiento.getDate())

      ) {

        edad--;

      }

      if (nacimiento > hoy || edad < 0) {

        mensaje.textContent = 'Comprueba la fecha indicada.';

        return;

      }

      sessionStorage.setItem(

        'franjaEdad',

        edad < 18 ? 'menor' : 'adulto'

      );

      window.location.href = 'participacion.html';

    }

  </script>

</body>

</html>
